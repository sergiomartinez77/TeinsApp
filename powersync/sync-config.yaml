# ═══════════════════════════════════════════════════════════════════════════
# TEINS — Configuración de sincronización de PowerSync (Sync Streams)
#
# Formato actual de PowerSync (Sync Streams, edición 3). Sustituye a las
# antiguas "Sync Rules" (bucket_definitions + token_parameters.user_id) que
# aparecían como comentario en la migración original 004.
#   Docs: https://docs.powersync.com/sync/streams/overview
#         https://docs.powersync.com/sync/streams/queries
#
# Cómo se carga: PowerSync Dashboard → tu instancia → "Sync Streams"/"Sync
# Config" → pegar este archivo → Validate → Deploy. (Con la CLI de PowerSync,
# este mismo archivo es `powersync/sync-config.yaml`.) Ver docs/BACKEND.md.
#
# • auth.user_id() = id del usuario de Supabase Auth (claim `sub` del JWT).
# • auto_subscribe: true → se sincroniza al conectar, sin código en la app
#   (la app no se suscribe a streams explícitamente).
# • Tipos (https://docs.powersync.com/sync/types): JSONB llega como TEXTO JSON
#   (responses, elements, sections_json; no hace falta ::text); BOOLEAN llega
#   como 1/0 (la app filtra is_active = 1); enums, UUID y fechas como texto;
#   NUMERIC como texto (por eso quantity se convierte a real).
# • visit_materials enumera sus columnas (por el CAST de quantity): una columna
#   nueva del servidor hay que añadirla aquí (p. ej. is_custom, migración
#   20261118000200). form_responses, photos y annotations usan SELECT *: sus
#   columnas nuevas (template_key, latitude, longitude, location_accuracy,
#   taken_at, format_version de la migración 20261122000100) llegan solas.
# • annotation_figures (migración 20261122000100): biblioteca de figuras de cada
#   técnico; no depende de ninguna visita (stream mis_figuras).
# • Inventario (migración 20261122000200), en el stream catalogos (bodega única,
#   igual para todos):
#     - material_catalog enumera sus columnas por el CAST de min_stock
#       (NUMERIC): una columna nueva del catálogo hay que añadirla aquí.
#     - material_stock no tiene columna id (su clave es material_id): se
#       entrega como `material_id AS id`. Sus cantidades son NUMERIC → real.
#       Solo la escriben triggers del servidor; la app nunca la sube.
#     - material_stock_movements: compras y ajustes (todos). quantity → real.
# ═══════════════════════════════════════════════════════════════════════════

config:
  edition: 3

streams:
  # Perfil del usuario conectado.
  mi_perfil:
    auto_subscribe: true
    query: SELECT * FROM profiles WHERE id = auth.user_id()

  # Visitas asignadas al técnico.
  mis_visitas:
    auto_subscribe: true
    query: SELECT * FROM visits WHERE technician_id = auth.user_id()

  # Filas hijas de las visitas del técnico.
  detalle_de_mis_visitas:
    auto_subscribe: true
    with:
      visitas_del_tecnico: SELECT id FROM visits WHERE technician_id = auth.user_id()
    queries:
      - SELECT * FROM form_responses WHERE visit_id IN visitas_del_tecnico
      - |
        SELECT id, visit_id, material_id, is_custom, material_code, material_name, unit,
               CAST(quantity AS real) AS quantity, observations, sync_status,
               created_at, updated_at
        FROM visit_materials WHERE visit_id IN visitas_del_tecnico
      - SELECT * FROM photos WHERE visit_id IN visitas_del_tecnico
      - SELECT * FROM annotations WHERE visit_id IN visitas_del_tecnico

  # Figuras guardadas por el técnico para reutilizarlas en otros planos.
  mis_figuras:
    auto_subscribe: true
    query: SELECT * FROM annotation_figures WHERE technician_id = auth.user_id()

  # Catálogos activos e inventario de la bodega (iguales para todos los usuarios).
  catalogos:
    auto_subscribe: true
    queries:
      - SELECT * FROM visit_types WHERE is_active = true
      - SELECT * FROM form_templates WHERE is_active = true
      - |
        SELECT id, code, name, description, unit, category, is_active,
               CAST(min_stock AS real) AS min_stock, created_at, updated_at
        FROM material_catalog WHERE is_active = true
      - |
        SELECT material_id AS id, material_id,
               CAST(purchased AS real) AS purchased, CAST(adjusted AS real) AS adjusted,
               CAST(used AS real) AS used, CAST(on_hand AS real) AS on_hand, updated_at
        FROM material_stock
      - |
        SELECT id, material_id, kind, CAST(quantity AS real) AS quantity, note, created_by,
               sync_status, created_at, updated_at
        FROM material_stock_movements
